<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Jobber Admin Factory</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand brand-lg"><span class="brand-mark">J</span><div><strong>Jobber Admin Factory</strong><small>Back-office JobberPlus</small></div></div>
      <label>Email administrateur<input id="login-email" type="email" required autocomplete="username"></label>
      <label>Mot de passe<input id="login-password" type="password" required autocomplete="current-password"></label>
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="btn btn-primary" type="submit" id="login-submit">Se connecter</button>
      <details class="login-advanced">
        <summary>Serveur</summary>
        <label>Adresse de l'API<input id="login-api" type="url" required></label>
        <button class="btn" type="button" id="login-api-save">Enregistrer le serveur</button>
      </details>
      <p class="muted small" id="login-version"></p>
    </form>
  </div>

  <div id="app" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">J</span><div><strong>Admin Factory</strong><small id="env-label"></small></div></div>
      <nav id="nav" aria-label="Pôles"></nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="search">
          <input id="global-search" type="search" placeholder="Rechercher un utilisateur, une mission, un paiement, un message…" aria-label="Recherche globale">
          <div id="search-results" class="search-results" hidden></div>
        </div>
        <label class="scope">Plateforme
          <select id="scope-platform"><option value="">Toutes</option></select>
        </label>
        <div class="me">
          <span id="me-name"></span>
          <span id="me-role" class="badge"></span>
          <button class="btn btn-ghost" id="logout">Déconnexion</button>
        </div>
      </header>
      <div id="banner"></div>
      <div class="crumbs" id="crumbs"></div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="lib.js"></script>
  <script src="pages.js"></script>
  <script src="app.js"></script>
</body>
</html>
