name: Jobber Admin Factory (installeur)

# Builds the desktop back-office installer. Download it from the run's
# "Artifacts" section (Actions tab → this workflow → latest run).
on:
  push:
    paths: ['admin-desktop/**', '.github/workflows/admin-desktop.yml']
  pull_request:
    paths: ['admin-desktop/**', '.github/workflows/admin-desktop.yml']
  workflow_dispatch:
    inputs:
      mac:
        description: 'Construire aussi la version macOS (.dmg)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: admin-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-desktop/package-lock.json
      - run: npm ci
      - run: npm run check
        shell: bash
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Jobber-Admin-Factory-Windows
          path: admin-desktop/dist/*.exe
          retention-days: 30

  mac:
    if: github.event_name == 'workflow_dispatch' && inputs.mac
    runs-on: macos-latest
    defaults:
      run:
        working-directory: admin-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-desktop/package-lock.json
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Jobber-Admin-Factory-macOS
          path: admin-desktop/dist/*.dmg
          retention-days: 30
